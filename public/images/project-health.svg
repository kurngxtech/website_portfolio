<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="healthGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgHealth)" />
  <rect width="1200" height="750" fill="url(#healthGlow)" />

  <!-- App Header -->
  <rect x="50" y="40" width="1100" height="60" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="85" cy="70" r="6" fill="#ef4444" />
  <circle cx="105" cy="70" r="6" fill="#f59e0b" />
  <circle cx="125" cy="70" r="6" fill="#10b981" />
  <text x="160" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f4f4f5">ANDROID NATIVE HEALTH MONITOR · KOTLIN &amp; ROOM DB</text>

  <!-- Mobile Phone Mockups in Center -->
  <g transform="translate(250, 130)">
    <!-- Device 1: Dashboard -->
    <rect x="0" y="0" width="310" height="560" rx="36" fill="#18181b" stroke="#38bdf8" stroke-width="2" />
    <rect x="15" y="15" width="280" height="530" rx="24" fill="#09090b" />
    
    <!-- Phone Notch -->
    <rect x="110" y="20" width="90" height="18" rx="9" fill="#27272a" />
    
    <text x="35" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Daily Vitals</text>
    <text x="35" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Sync: SQLite Room DB</text>

    <!-- Heart rate card -->
    <rect x="30" y="115" width="250" height="110" rx="14" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
    <text x="50" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a5b4fc">HEART RATE</text>
    <text x="50" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#ffffff">72 <tspan font-size="14" fill="#a5b4fc">BPM</tspan></text>

    <!-- Steps Card -->
    <rect x="30" y="240" width="250" height="110" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="50" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">STEP COUNTER</text>
    <text x="50" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#ffffff">8,420 <tspan font-size="14" fill="#71717a">steps</tspan></text>
  </g>

  <g transform="translate(620, 150)">
    <!-- Device 2: Analytics -->
    <rect x="0" y="0" width="310" height="540" rx="36" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <rect x="15" y="15" width="280" height="510" rx="24" fill="#09090b" />
    
    <text x="35" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Sleep &amp; Recovery</text>
    <text x="35" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">Efficiency: 94%</text>

    <rect x="30" y="120" width="250" height="160" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="50" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">WEEKLY TREND</text>
    <path d="M 50 230 Q 90 180, 130 200 T 210 170 T 250 180" fill="none" stroke="#38bdf8" stroke-width="3" />
    
    <rect x="30" y="300" width="250" height="140" rx="14" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="50" y="330" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5eead4">ARCHITECTURE</text>
    <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">MVVM + Jetpack</text>
    <text x="50" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Coroutines Flow</text>
  </g>
</svg>


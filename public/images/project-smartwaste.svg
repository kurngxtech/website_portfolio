<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWaste" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#141c18" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="wasteGlow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgWaste)" />
  <rect width="1200" height="750" fill="url(#wasteGlow)" />

  <!-- Top App Navigation Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="85" cy="70" r="6" fill="#ef4444" />
  <circle cx="105" cy="70" r="6" fill="#f59e0b" />
  <circle cx="125" cy="70" r="6" fill="#10b981" />
  <text x="160" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f4f4f5">SMARTWASTE · FOOD SURPLUS &amp; DISTRIBUTION PLATFORM</text>
  <rect x="940" y="55" width="180" height="30" rx="6" fill="#065f46" />
  <text x="1030" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a7f3d0">IMPACT TRACKER</text>

  <!-- Dashboard Overview Cards -->
  <g transform="translate(50, 125)">
    <!-- Metric Card 1 -->
    <rect x="0" y="0" width="345" height="150" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="30" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">FOOD SURPLUS RESCUED</text>
    <text x="30" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#ffffff">1,420 <tspan font-size="16" font-weight="500" fill="#a1a1aa">kg</tspan></text>
    <text x="30" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#34d399">↑ 24% increase this month</text>

    <!-- Metric Card 2 -->
    <rect x="375" y="0" width="345" height="150" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="405" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">MEALS REDISTRIBUTED</text>
    <text x="405" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#ffffff">2,840 <tspan font-size="16" font-weight="500" fill="#a1a1aa">meals</tspan></text>
    <text x="405" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#38bdf8">Coordinated across 8 shelters</text>

    <!-- Metric Card 3 -->
    <rect x="755" y="0" width="345" height="150" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="785" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">COMMUNITY PARTNERS</text>
    <text x="785" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#ffffff">36 <tspan font-size="16" font-weight="500" fill="#a1a1aa">vendors</tspan></text>
    <text x="785" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a78bfa">Active restaurants &amp; bakeries</text>
  </g>

  <!-- Big Analytics Visualization & Activity Stream (Bottom) -->
  <g transform="translate(50, 305)">
    <!-- Chart Area (Left) -->
    <rect x="0" y="0" width="690" height="390" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#ffffff">Surplus Collection &amp; Redistribution Velocity</text>
    <text x="35" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">Weekly aggregate metrics (kg rescued vs. delivered)</text>

    <!-- SVG Simulated Bar/Line Chart -->
    <g transform="translate(40, 110)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="610" y2="200" stroke="#3f3f46" stroke-width="1" />
      <line x1="0" y1="130" x2="610" y2="130" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="0" y1="60" x2="610" y2="60" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Bars -->
      <rect x="40" y="90" width="35" height="110" rx="4" fill="#047857" />
      <rect x="130" y="60" width="35" height="140" rx="4" fill="#047857" />
      <rect x="220" y="40" width="35" height="160" rx="4" fill="#059669" />
      <rect x="310" y="75" width="35" height="125" rx="4" fill="#059669" />
      <rect x="400" y="30" width="35" height="170" rx="4" fill="#10b981" />
      <rect x="490" y="20" width="35" height="180" rx="4" fill="#34d399" />

      <!-- Curved Trend Line -->
      <path d="M 57 100 Q 150 50, 240 45 T 420 30 T 510 15" fill="none" stroke="#6ee7b7" stroke-width="3" />
      <circle cx="507" cy="15" r="5" fill="#ffffff" />
    </g>
    
    <!-- Real-time Flow (Right) -->
    <rect x="715" y="0" width="385" height="390" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="745" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#ffffff">Live Activity Log</text>
    <text x="745" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">MongoDB event dispatchers</text>

    <g transform="translate(745, 100)">
      <rect x="0" y="0" width="325" height="65" rx="8" fill="#27272a" />
      <text x="15" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Surplus Package Logged</text>
      <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">45 kg from Artisan Bakery</text>

      <rect x="0" y="80" width="325" height="65" rx="8" fill="#27272a" />
      <text x="15" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Courier Dispatch Completed</text>
      <text x="15" y="128" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa">Delivered to Hope Community Shelter</text>

      <rect x="0" y="160" width="325" height="65" rx="8" fill="#27272a" />
      <text x="15" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Batch Expiry Alert Resolved</text>
      <text x="15" y="208" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">Quality check passed (100%)</text>
    </g>
  </g>
</svg>


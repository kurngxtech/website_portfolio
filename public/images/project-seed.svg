<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="seedGlow" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgSeed)" />
  <rect width="1200" height="750" fill="url(#seedGlow)" />

  <rect x="50" y="40" width="1100" height="60" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="85" cy="70" r="6" fill="#ef4444" />
  <circle cx="105" cy="70" r="6" fill="#f59e0b" />
  <circle cx="125" cy="70" r="6" fill="#10b981" />
  <text x="160" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f4f4f5">SEED OF HOPE · CHARITY &amp; DISASTER RELIEF WEB PLATFORM</text>
  
  <g transform="translate(50, 130)">
    <rect width="1100" height="550" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
    
    <text x="60" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="2">COMMUNITY ENGAGEMENT &amp; DONATION TRACKING</text>
    <text x="60" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#ffffff">Transparent Relief Funding</text>
    
    <!-- Campaign progress card -->
    <rect x="60" y="170" width="550" height="220" rx="14" fill="#27272a" />
    <text x="90" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f4f4f5">Clean Water &amp; Medical Supplies Campaign</text>
    
    <text x="90" y="260" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a1a1aa">FUNDS RAISED</text>
    <text x="90" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#34d399">$48,250 <tspan font-size="14" font-weight="400" fill="#a1a1aa">/ $60,000 target</tspan></text>
    
    <!-- Progress bar -->
    <rect x="90" y="325" width="490" height="12" rx="6" fill="#3f3f46" />
    <rect x="90" y="325" width="395" height="12" rx="6" fill="#f59e0b" />
    <text x="90" y="360" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">80.4% Completed · 420 Donors</text>

    <!-- Side cards -->
    <rect x="650" y="170" width="390" height="100" rx="14" fill="#27272a" />
    <text x="680" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa">SECURITY &amp; COMPLIANCE</text>
    <text x="680" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">Automated Donation Receipts</text>

    <rect x="650" y="290" width="390" height="100" rx="14" fill="#27272a" />
    <text x="680" y="330" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">STACK INTEGRATION</text>
    <text x="680" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">Laravel PHP &amp; MySQL Relational DB</text>
  </g>
</svg>


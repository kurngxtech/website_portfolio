<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <rect width="600" height="750" fill="url(#glow)" />

  <!-- Subtle Minimal Grid -->
  <pattern id="smallGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
  </pattern>
  <rect width="600" height="750" fill="url(#smallGrid)" />

  <!-- Corner Brackets -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 560 60 L 560 40 L 540 40" fill="none" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 40 690 L 40 710 L 60 710" fill="none" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 560 690 L 560 710 L 540 710" fill="none" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Metadata -->
  <text x="50%" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="3">PORTRAIT / HEADSHOT</text>

  <!-- Silhouette / Minimal Avatar -->
  <g transform="translate(0, -10)">
    <!-- Head halo -->
    <circle cx="300" cy="300" r="110" fill="#3f3f46" fill-opacity="0.3" stroke="#52525b" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Head -->
    <circle cx="300" cy="300" r="95" fill="url(#avatarGrad)" />
    <!-- Monogram Initials inside Head -->
    <text x="300" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="800" fill="#f4f4f5" letter-spacing="-1">BK</text>
    
    <!-- Shoulders -->
    <path d="M 170 540 C 170 420, 220 410, 300 410 C 380 410, 430 420, 430 540 Z" fill="url(#avatarGrad)" />
  </g>

  <!-- Accent Divider Line -->
  <line x1="120" y1="580" x2="480" y2="580" stroke="url(#lineGrad)" stroke-width="1.5" />

  <!-- Bottom Labels -->
  <text x="50%" y="620" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" letter-spacing="0.5">Bagus Kurniawan</text>
  <text x="50%" y="645" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#60a5fa" letter-spacing="1">Software Engineer · Backend &amp; Cloud</text>
  <text x="50%" y="685" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#71717a">Ready for real headshot replacement</text>
  <text x="50%" y="702" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="400" fill="#52525b">/public/images/portrait.jpg</text>
</svg>


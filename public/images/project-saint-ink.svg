<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="40%" stop-color="#121215" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="saintGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgSaint)" />
  <rect width="1200" height="750" fill="url(#saintGlow)" />

  <!-- Mock App Top Bar / Navigation inside canvas -->
  <rect x="50" y="40" width="1100" height="60" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="85" cy="70" r="6" fill="#ef4444" />
  <circle cx="105" cy="70" r="6" fill="#f59e0b" />
  <circle cx="125" cy="70" r="6" fill="#10b981" />
  <text x="160" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f4f4f5">SAINT INK TATTOO STUDIO</text>
  <rect x="850" y="55" width="120" height="30" rx="6" fill="#27272a" />
  <text x="910" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">ADMIN CMS</text>
  <rect x="990" y="55" width="130" height="30" rx="6" fill="#2563eb" />
  <text x="1055" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ffffff">BOOK SESSION</text>

  <!-- Hero Banner inside canvas -->
  <rect x="50" y="125" width="680" height="340" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
  <text x="90" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="2">PRODUCTION PLATFORM · CMS &amp; RLS</text>
  <text x="90" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff">Fine-Line Tattoo Art &amp;</text>
  <text x="90" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff">Digital Studio Management</text>
  <text x="90" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#a1a1aa">Custom Supabase PostgreSQL Row Level Security (RLS) backend with React frontend.</text>
  
  <rect x="90" y="375" width="150" height="42" rx="8" fill="#f4f4f5" />
  <text x="165" y="401" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#18181b">Explore Gallery</text>
  
  <rect x="255" y="375" width="160" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <text x="335" y="401" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Admin Protected</text>

  <!-- Right Side: CMS Analytics & Security Widget -->
  <rect x="755" y="125" width="395" height="340" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
  <text x="790" y="175" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#60a5fa">SYSTEM &amp; SECURITY STATUS</text>
  
  <rect x="790" y="200" width="325" height="65" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="810" y="226" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">SUPABASE POSTGRESQL</text>
  <text x="810" y="248" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#34d399">✓ RLS Active &amp; Verified</text>
  
  <rect x="790" y="280" width="325" height="65" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="810" y="306" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">CI / CD AUTOMATION</text>
  <text x="810" y="328" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#60a5fa">✓ Playwright Tests Passed</text>

  <rect x="790" y="360" width="325" height="75" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="810" y="386" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">PRODUCTION METRICS</text>
  <text x="810" y="414" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff">99.9% <tspan font-size="12" font-weight="400" fill="#a1a1aa">Uptime on Vercel</tspan></text>

  <!-- Bottom: 3 Artwork Showcase Cards -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="350" height="210" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="15" y="15" width="320" height="125" rx="8" fill="#27272a" />
    <text x="175" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">ARTWORK GALLERY 01</text>
    <text x="25" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">Minimalist Linework Art</text>
    <text x="25" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Dynamic CMS Asset</text>

    <rect x="375" y="0" width="350" height="210" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="390" y="15" width="320" height="125" rx="8" fill="#27272a" />
    <text x="550" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">ARTWORK GALLERY 02</text>
    <text x="400" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">Botanical Geometric Study</text>
    <text x="400" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Dynamic CMS Asset</text>

    <rect x="750" y="0" width="350" height="210" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="765" y="15" width="320" height="125" rx="8" fill="#27272a" />
    <text x="925" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">ARTWORK GALLERY 03</text>
    <text x="775" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f4f4f5">Contemporary Flash Art</text>
    <text x="775" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Dynamic CMS Asset</text>
  </g>
</svg>


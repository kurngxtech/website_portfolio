<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCinema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="cinemaGlow" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgCinema)" />
  <rect width="1200" height="750" fill="url(#cinemaGlow)" />

  <!-- Top App Navigation Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="85" cy="70" r="6" fill="#ef4444" />
  <circle cx="105" cy="70" r="6" fill="#f59e0b" />
  <circle cx="125" cy="70" r="6" fill="#10b981" />
  <text x="160" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f4f4f5">CINEHUB · MULTI-ROLE TICKETING PLATFORM</text>
  <rect x="920" y="55" width="200" height="30" rx="6" fill="#312e81" />
  <text x="1020" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a5b4fc">ROLES: CUSTOMER / ADMIN</text>

  <!-- Cinema Booking Screen Architecture (Left 65%) -->
  <g transform="translate(50, 125)">
    <rect width="720" height="570" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
    
    <!-- Curved Cinema Screen -->
    <path d="M 80 80 Q 360 40 640 80" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M 80 80 Q 360 40 640 80 L 640 180 L 80 180 Z" fill="url(#screenGrad)" />
    <text x="360" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a5b4fc" letter-spacing="3">THEATER SCREEN</text>

    <!-- Interactive Seat Matrix Map -->
    <g transform="translate(110, 210)">
      <!-- Row A -->
      <circle cx="40" cy="0" r="14" fill="#34d399" />
      <circle cx="90" cy="0" r="14" fill="#34d399" />
      <circle cx="140" cy="0" r="14" fill="#34d399" />
      <circle cx="210" cy="0" r="14" fill="#3f3f46" />
      <circle cx="260" cy="0" r="14" fill="#3f3f46" />
      <circle cx="310" cy="0" r="14" fill="#3f3f46" />
      <circle cx="380" cy="0" r="14" fill="#34d399" />
      <circle cx="430" cy="0" r="14" fill="#34d399" />
      <circle cx="480" cy="0" r="14" fill="#6366f1" stroke="#a5b4fc" stroke-width="2" />

      <!-- Row B -->
      <circle cx="40" cy="50" r="14" fill="#34d399" />
      <circle cx="90" cy="50" r="14" fill="#34d399" />
      <circle cx="140" cy="50" r="14" fill="#3f3f46" />
      <circle cx="210" cy="50" r="14" fill="#6366f1" stroke="#a5b4fc" stroke-width="2" />
      <circle cx="260" cy="50" r="14" fill="#6366f1" stroke="#a5b4fc" stroke-width="2" />
      <circle cx="310" cy="50" r="14" fill="#3f3f46" />
      <circle cx="380" cy="50" r="14" fill="#34d399" />
      <circle cx="430" cy="50" r="14" fill="#34d399" />
      <circle cx="480" cy="50" r="14" fill="#34d399" />

      <!-- Row C -->
      <circle cx="40" cy="100" r="14" fill="#3f3f46" />
      <circle cx="90" cy="100" r="14" fill="#3f3f46" />
      <circle cx="140" cy="100" r="14" fill="#34d399" />
      <circle cx="210" cy="100" r="14" fill="#34d399" />
      <circle cx="260" cy="100" r="14" fill="#34d399" />
      <circle cx="310" cy="100" r="14" fill="#34d399" />
      <circle cx="380" cy="100" r="14" fill="#3f3f46" />
      <circle cx="430" cy="100" r="14" fill="#3f3f46" />
      <circle cx="480" cy="100" r="14" fill="#3f3f46" />

      <!-- Row D -->
      <circle cx="40" cy="150" r="14" fill="#34d399" />
      <circle cx="90" cy="150" r="14" fill="#34d399" />
      <circle cx="140" cy="150" r="14" fill="#34d399" />
      <circle cx="210" cy="150" r="14" fill="#34d399" />
      <circle cx="260" cy="150" r="14" fill="#34d399" />
      <circle cx="310" cy="150" r="14" fill="#34d399" />
      <circle cx="380" cy="150" r="14" fill="#34d399" />
      <circle cx="430" cy="150" r="14" fill="#34d399" />
      <circle cx="480" cy="150" r="14" fill="#34d399" />
    </g>

    <!-- Legend -->
    <g transform="translate(180, 430)">
      <circle cx="0" cy="0" r="8" fill="#34d399" />
      <text x="18" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Available</text>
      
      <circle cx="140" cy="0" r="8" fill="#6366f1" />
      <text x="158" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Selected (3)</text>
      
      <circle cx="290" cy="0" r="8" fill="#3f3f46" />
      <text x="308" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Reserved</text>
    </g>
  </g>

  <!-- Right Side: Order Summary & Checkout Info (Right 35%) -->
  <g transform="translate(795, 125)">
    <rect width="355" height="570" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
    
    <text x="35" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Booking Summary</text>
    <text x="35" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8">INCEPTION (IMAX 3D)</text>

    <!-- Details Card -->
    <rect x="30" y="110" width="295" height="150" rx="12" fill="#27272a" />
    <text x="50" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">CINEMA HALL</text>
    <text x="50" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">Studio 01 · Ultra Screen</text>
    
    <text x="50" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">SEATS SELECTED</text>
    <text x="50" y="233" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#34d399">Row A: 9 · Row B: 4, 5</text>

    <!-- Payment & Multi-Role Status -->
    <rect x="30" y="280" width="295" height="140" rx="12" fill="#27272a" />
    <text x="50" y="315" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">DATABASE ENGINE</text>
    <text x="50" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#ffffff">MongoDB Data Collections</text>
    
    <text x="50" y="380" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">FRONTEND ARCHITECTURE</text>
    <text x="50" y="403" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Angular 18 &amp; TypeScript</text>

    <!-- Action Button -->
    <rect x="30" y="460" width="295" height="50" rx="10" fill="#4f46e5" />
    <text x="177" y="492" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Confirm Reservation →</text>
  </g>
</svg>

